<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMALDINI FARM HOUSE</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f4f2; color: #333; text-align: center; }
        header { padding: 40px 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h1 { margin: 0 0 10px 0; font-size: 2rem; color: #2c3e50; }
        p { margin: 0; color: #7f8c8d; font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.5; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .gallery-item { background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .gallery img { width: 100%; height: auto; border-radius: 4px; display: block; }
    </style>
</head>
<body>

    <header>
        <h1>Jamaldini Farm House</h1>
        <p>Welcome to our farmhouse. A peaceful place surrounded by nature, beautiful views, fresh air, and a relaxing environment. Browse our gallery to see the farmhouse and its surroundings.</p>
    </header>

    <div class="gallery">
        <div class="gallery-item"><img src="IMG_3265.jpeg" alt="Farmhouse View 1"></div>
        <div class="gallery-item"><img src="cff66b9f-0d0c-4576-a9e3-b2b71b6f25d.jpeg" alt="Farmhouse View 2"></div>
    </div>

</body>
</html>
